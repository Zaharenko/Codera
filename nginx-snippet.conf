# Apply on the Hetzner nginx vhost for codera.click, then reload nginx.
# Purge any CDN/proxy cache for / after deploy so / is not stuck on an old HTML build.

# Canonical: /index.html → /
location = /index.html {
    return 301 /;
}

# Retired marketing URLs → home (one-page site)
location ~ ^/(about|changelog|roadmap|offline-alternatives|vscode-companion|codera-vs-google-lens|codera-vs-selectext|how-to-copy-code-from-youtube|how-to-copy-code-from-udemy|extract-code-from-screenshot)\.html$ {
    return 301 /;
}
location ^~ /ru/ { return 301 /; }
location ^~ /guides/ { return 301 /; }
location ^~ /compare/ { return 301 /; }

# Short cache for HTML so SEO/meta updates are not sticky for days
location ~* \.html$ {
    add_header Cache-Control "public, max-age=300, must-revalidate";
}

location = / {
    add_header Cache-Control "public, max-age=300, must-revalidate";
}

# Longer cache for static assets (bump ?v= on video/og when replacing files)
location ~* \.(mp4|jpg|png|webp|ico)$ {
    add_header Cache-Control "public, max-age=604800";
}
